[package]
name = "windows-scm"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["zevs"]
description = "Safe wrapper around the local Windows Service Control Manager: OpenSCManagerW, CreateService, EnumServicesStatusEx, StartService, ControlService, QueryServiceStatusEx"
repository = "https://github.com/icedracon/windows-scm"
homepage = "https://github.com/icedracon/windows-scm"
documentation = "https://docs.rs/windows-scm"
readme = "README.md"
keywords = ["windows", "scm", "service", "scm", "svcctl"]
categories = ["os::windows-apis", "api-bindings"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_Services",
    "Win32_Foundation",
    "Win32_Security",
] }
windows-core = "0.58"
thiserror = "2"

[dev-dependencies]
