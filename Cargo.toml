[package]
name = "windows-scm"
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["zevs"]
description = "Safe Rust wrappers for local Windows Service Control Manager enumeration, status, control, creation, and deletion."
repository = "https://github.com/icedracon/windows-scm"
homepage = "https://github.com/icedracon/windows-scm"
documentation = "https://docs.rs/windows-scm"
readme = "README.md"
keywords = ["windows", "scm", "service-control", "security", "forensics"]
categories = ["os::windows-apis", "api-bindings"]

[target.'cfg(windows)'.dependencies]
win32-min = { version = "0.1.2", features = ["services"] }
thiserror = "2"

[dev-dependencies]
